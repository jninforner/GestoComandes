<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>GestoCatalog</title>
<link rel="icon" type="image/png" href="./icon.png?v=1.20.0">
<link rel="apple-touch-icon" sizes="180x180" href="./icon.png?v=1.20.0">
<style>:root{color-scheme:light;--bg:#f7f8fd;--tx:#28377e;--mu:#566598;--ln:#303f91;--surface:#fff;--soft:#f0f2fc;--border:#d4daf1;--field:#b6bfdf;--on:#fff;--red:#b42318;--green:#17734a}
:root[data-theme=dark]{color-scheme:dark;--bg:#10152c;--tx:#e5e9ff;--mu:#adb8e5;--ln:#a1afff;--surface:#1b2447;--soft:#232f59;--border:#425080;--field:#6371a0;--on:#10152c;--red:#ff9992;--green:#84dbab}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:20px 16px 36px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:18px}
h1{font-size:28px;letter-spacing:-.035em;margin:0}
h2{font-size:21px;margin:0 0 14px}
h3{font-size:17px;margin:0 0 8px}
p{margin:8px 0}
nav,.actions{display:flex;gap:8px;flex-wrap:wrap}
nav{margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 3px 14px rgba(40,55,126,.055);padding:20px;margin-bottom:16px}
label{display:grid;gap:4px;font-size:14px;color:var(--mu)}
input,select,textarea{width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--field);border-radius:10px;background:var(--surface);color:var(--tx);font:inherit;font-size:16px}
textarea{display:block;resize:vertical;margin:10px 0}
button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 15px;border:1px solid var(--ln);border-radius:10px;background:var(--surface);color:var(--tx);font:600 15px/1.3 inherit;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
button:hover,.button:hover{background:var(--soft)}
.primary,[aria-current=page]{background:var(--ln);color:var(--on)}
.primary:hover,[aria-current=page]:hover{background:var(--ln);filter:brightness(1.13)}
:focus-visible{outline:3px solid #788cf0;outline-offset:2px}
button:disabled{opacity:.55;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.item{border-top:1px solid var(--border);padding:8px 0}
.item:last-child{padding-bottom:0}
.meta{color:var(--mu);font-size:14px}
.error,.remove{color:var(--red)}
#status:empty{display:none}
#status{margin-bottom:12px}
.whatsapp{color:var(--green);border-color:var(--green)}
@media(max-width:430px){main{padding:14px 12px 28px}.card{padding:15px}h1{font-size:24px}nav button{padding:8px 11px}}
.order-lookup{margin-bottom:12px}
.order-matches{margin-top:6px;max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:10px}
.order-matches button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;border-radius:0;text-align:left}
.order-matches button+button{border-top:1px solid var(--border)}
.order-matches button:focus-visible{outline-offset:-3px}
#order-match-status:empty{display:none}
#line{margin-top:12px}
[hidden]{display:none !important}
.topbar{position:relative;gap:12px;padding-bottom:10px;border:0}
.brand{min-width:0}
.brand h1{font-size:clamp(20px,4.5vw,30px);line-height:1.1;overflow-wrap:anywhere}
.version{margin-top:5px}
.top-actions{display:flex;flex-shrink:0;gap:8px;align-items:center}
.top-actions button{gap:7px;min-height:42px;padding:8px 12px;white-space:nowrap}
.top-actions button span:first-child{font-size:18px;line-height:1}
.menu-anchor{position:relative}
#menu-panel{position:absolute;top:calc(100% + 8px);right:0;z-index:5;width:max-content;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 30px rgba(40,55,126,.15);padding:10px}
#tabs{display:grid;gap:6px;margin:0 0 6px}
#menu-panel button{width:100%;justify-content:flex-start;white-space:nowrap}
@media(max-width:430px){
  .topbar,.top-actions{gap:6px}
  .top-actions button{font-size:14px;padding:7px 9px}
  .version{font-size:13px}
}
.catalog-line{margin-top:12px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--soft)}
:root{--draft-highlight:#edf8f1}
:root[data-theme=dark]{--draft-highlight:#19332e}
.item.in-draft,.order-matches button.in-draft{background:var(--draft-highlight)}
.item.in-draft{padding-inline:10px;border-radius:8px}
.draft-badge{display:inline-block;margin-inline-start:8px;color:var(--green);font-size:13px;font-weight:650}
.order-matches .draft-badge{margin-inline-start:0}
#read-catalog button,#confirm-pdf>.actions{margin-top:10px}
.pdf-rows{max-height:55vh;overflow:auto;margin-top:12px}
.pdf-row{display:grid;grid-template-columns:5rem minmax(9rem,2fr) repeat(2,minmax(5rem,1fr));gap:8px;padding:10px 0;border-top:1px solid var(--border)}
.pdf-select{display:flex;align-items:center;align-self:center;white-space:nowrap}
.pdf-select input{width:18px;min-height:18px}
@media(max-width:550px){
  .pdf-row{grid-template-columns:1fr 1fr}
  .pdf-row label:nth-child(2){grid-column:1/-1;grid-row:2}
}
main{width:100%;padding-inline:max(12px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-right))}
.card,.grid,.grid>* ,label,.row>*{min-width:0}
input,select,textarea,button,.button{max-width:100%;min-width:0}
input[type=file]{width:100%}
img,video,canvas{max-width:100%;height:auto}
.card{overflow-wrap:anywhere}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
#login-panel{max-width:500px;margin-inline:auto}
#login-form .grid{grid-template-columns:minmax(0,1fr)}
.login-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#password-reset{display:inline-block;margin:12px 0;color:var(--tx);text-underline-offset:.18em}
#login-status:empty{display:none}
.contact-actions{margin:8px 0 12px}
.contact-file{position:relative;cursor:pointer}
.contact-file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.contact-file:focus-within{outline:3px solid #788cf0;outline-offset:2px}
.recipient-picker{margin-top:10px}
.recipient-picker form{margin-top:12px}
.remember-contact{display:flex;align-items:center;gap:8px;margin:12px 0}
.remember-contact input{width:18px;min-height:18px;flex:none}
@media(max-width:480px){
  html{-webkit-text-size-adjust:100%}
  .topbar{align-items:flex-start;gap:8px;margin-bottom:8px;padding-bottom:4px}
  .top-actions{gap:4px}
  .top-actions #menu-toggle,.top-actions #logout{width:44px;min-height:44px;padding:0;border-color:transparent;background:transparent}
  .top-actions .top-action-label{display:none}
  .menu-anchor{position:static}
  #menu-panel{top:100%;right:0;max-width:100%}
  button,.button{touch-action:manipulation}
  #line .grid,#catalog-line .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  #line .grid>label:first-of-type,#catalog-line .grid>label:first-of-type{grid-column:1/-1}
}

.order-lines{background:#eaf0ff;border-color:#afbfeb}
:root[data-theme=dark] .order-lines{background:#202e55;border-color:#516798}


.order-list-heading{display:flex;align-items:start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.order-list-heading h2{margin:0}
#order-visibility{gap:6px;padding-inline:10px}
#order-visibility[aria-pressed=true]{background:var(--ln);color:var(--on)}
.order-send{margin-top:12px}
.order-category{margin-top:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.order-category h3{margin:0;padding:7px 11px;background:var(--soft);border-radius:11px 11px 0 0;font-size:15px}
.order-list-row{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:start;border-top:1px solid var(--border)}
.order-list-row.is-ordered{background:var(--soft)}
.order-toggle,.order-pencil{border:0;border-radius:0;background:transparent}
.order-toggle{width:100%;min-height:40px;justify-content:start;gap:8px;padding:4px 9px;text-align:start}
.order-marker{flex:0 0 18px;height:18px;border:1px solid var(--field);border-radius:5px;text-align:center;line-height:16px}
.is-ordered .order-marker{background:var(--ln);color:var(--on);border-color:var(--ln)}
.order-item-copy{display:grid;min-width:0;line-height:1.2;gap:1px}
.order-item-copy strong,.order-item-copy .meta{overflow-wrap:anywhere}
.order-item-copy .meta{font-weight:400}
.order-list-row strong{color:var(--red)}
.order-list-row.is-ordered strong{color:var(--green)}
.order-pencil{width:44px;padding:0;font-size:21px}
.order-editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:8px 10px 12px}
.order-editor label:nth-child(3),.order-editor .actions,.order-editor [data-editor-error]{grid-column:1/-1}

.order-list-filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;align-items:end;gap:8px;min-width:0;flex:1 1 100%}
.order-list-filters label{width:100%}
.order-list-filters select{height:44px;min-height:44px}

#order-dialog{width:min(460px,calc(100% - 24px));max-height:calc(100% - 24px);padding:18px;color:var(--tx);background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow-wrap:anywhere}
#order-dialog::backdrop{background:#11183180}
#order-dialog .order-editor{padding:0}

.order-lines .order-lookup{margin:14px 0 0}
#order-add-search{display:flex;gap:8px;align-items:end}
#order-add-search label{flex:1 1 auto;min-width:0}
#order-search-submit[hidden]{display:none}
#order-add-search button{min-height:46px}

.catalog-management{margin-bottom:10px}
.article-merge-choice{display:flex;align-items:center;gap:5px;min-height:44px}
.article-merge-choice input{width:18px;min-height:18px}

.staff-worker summary{cursor:pointer}
.staff-worker form{display:flex;flex-wrap:wrap;align-items:end;gap:8px;margin:8px 0}
.staff-worker form label{flex:1 1 14rem}

@media(max-width:480px){
  .order-lines{padding:11px}
  .order-list-heading{display:grid;gap:6px}
  .order-list-heading h2{font-size:19px;line-height:1.2}
  .order-list-heading .meta{font-size:13px}
  .order-list-filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 8px}
  .order-list-filters label{width:100%;gap:2px;font-size:12px}
  .order-list-filters select{height:40px;min-height:40px;padding:4px 6px;text-overflow:ellipsis}
  #order-visibility{grid-column:1/-1;justify-self:start;min-height:40px;padding-block:4px;font-size:14px}
  .order-lines .order-lookup{margin-top:6px}
  #order-add-search{gap:6px}
  #order-add-search label{gap:2px;font-size:12px}
  #order-add-search input,#order-add-search button{min-height:42px;padding-block:4px}
  .order-category{margin-top:8px}
}
.order-list-row{grid-template-columns:minmax(0,1fr) auto 44px}
.order-list-row:not(.is-ordered){grid-template-columns:minmax(0,1fr) 44px}
.order-steps{display:flex;gap:4px;align-items:center;padding:6px 0}
.order-step{min-width:0;width:38px;min-height:36px;padding:0;font-size:14px}
#order-dialog{width:min(560px,calc(100% - 24px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{margin:0}
#close-order-dialog{min-width:0;width:40px;min-height:40px;padding:0}
.sheet-part{border-top:1px solid var(--border);margin-top:14px;padding-top:12px}
.sheet-part h3{margin:0 0 8px}
.sheet-offer{margin-top:10px}
.sheet-foot{border-top:1px solid var(--border);margin-top:14px;padding-top:12px}
.invoice-card{margin:0 0 14px}
.invoice-card>summary{cursor:pointer;font-weight:650}
.invoice-card form{margin-top:10px}
.purchase-row{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:12px 0 0}
.purchase-row legend{font-weight:650;padding:0 4px}
.purchase-row.is-discarded{opacity:.6}
.purchase-row .grid{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.purchase-article{grid-column:1/-1}
.purchase-row-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.purchase-row-actions .meta{flex:1 1 200px;margin:0}
.purchase-check{display:flex;align-items:center;gap:6px;color:var(--tx)}
.purchase-check input{width:auto;min-height:0}
.purchase-head{width:100%;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:transparent;padding:0;text-align:left}
.purchase-head:hover{background:transparent}
.article-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:6px;border-top:1px solid var(--border);padding:2px 0}
.article-row.in-draft{padding-inline:6px;border-radius:8px}
.article-select{width:20px;min-height:20px;margin:0 6px}
.article-open{display:block;min-width:0;min-height:36px;justify-content:flex-start;border:0;background:transparent;padding:6px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.article-open:hover{background:var(--soft)}
.article-open .meta{font-size:14px}
.icon-button{min-width:0;width:36px;min-height:36px;padding:0}
.catalog-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;border-top:1px solid var(--border);padding:2px 0}
.catalog-name{min-width:0;padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-button.remove{border-color:var(--red)}
.icon-button:disabled{opacity:.35}
.bulk-bar{border:1px solid var(--main-border,var(--border));background:var(--soft);border-radius:12px;padding:12px;margin:10px 0}
.bulk-bar .actions{margin:8px 0}
.bulk-bar form{margin-top:8px;align-items:end}
.bulk-submit{display:flex;align-items:flex-end}
.catalog-new>summary{cursor:pointer;font-weight:700;font-size:17px}
.catalog-new[open]>summary{margin-bottom:10px}

.worker-profiles .worker-profile-item{border-top:1px solid var(--border);padding:10px 0}
.worker-profile-item>summary,.worker-profile-inactive>summary{cursor:pointer;min-height:34px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.worker-profile-item>summary::before,.worker-profile-inactive>summary::before{content:"+"}
.worker-profile-item[open]>summary::before,.worker-profile-inactive[open]>summary::before{content:"−"}
.worker-profile-item>summary strong,.worker-profile-inactive>summary strong{flex:1}
.worker-profile-item>summary span,.worker-profile-inactive>summary span{color:var(--muted,var(--mu));font-size:14px}
.worker-profile{padding:12px 0 4px}
.worker-profile-fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));margin-bottom:12px}
.worker-profile-option{display:flex;align-items:center;gap:8px;margin:10px 0}
.worker-profile-option input{width:20px;height:20px;min-height:20px;margin:0;flex:none}
.worker-profiles h3{margin-top:14px}

.worker-contact-actions{margin-bottom:8px}
.worker-contact-actions label{position:relative;cursor:pointer}
.worker-contact-actions input{position:absolute;inset:0;opacity:0;cursor:pointer}
.worker-contact-actions label:focus-within{outline:3px solid #788cf0;outline-offset:2px}
[data-worker-contact-options] label{margin-bottom:8px}

.worker-contact-actions:empty{display:none}
/* Aspecte comú de les apps Gesto: requadre principal amb fons blau clar (com «Nova comanda») i blocs blancs a dins. */
:root{--main-bg:#eaf0ff;--main-border:#afbfeb}
:root[data-theme=dark]{--main-bg:#202e55;--main-border:#516798}
.main-card{background:var(--main-bg);border-color:var(--main-border)}
.main-card .card{background:var(--surface);box-shadow:none;border-radius:14px;padding:16px;margin:12px 0 0}
.main-card .card h3:first-child{margin-top:0}
.main-card .card h2{font-size:17px;margin:0 0 10px}
.main-card>.card:first-of-type{margin-top:14px}
</style>
<link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
<main>
<header class="topbar">
  <div class="brand"><h1>GestoCatalog</h1><div class="meta version">Versió 1.20.0<span id="sync-state" role="status"></span></div></div>
  <div class="top-actions">
    <div class="menu-anchor">
      <button id="menu-toggle" type="button" aria-label="Menú" aria-expanded="false" aria-controls="menu-panel" hidden><span aria-hidden="true">☰</span><span class="top-action-label" aria-hidden="true">Menú</span></button>
      <div id="menu-panel" hidden>
        <nav aria-label="Seccions" id="tabs"></nav>
        <button id="theme" type="button" aria-pressed="false">Mode fosc</button>
      </div>
    </div>
    <button id="logout" type="button" aria-label="Sortir" hidden><span aria-hidden="true">↪︎</span><span class="top-action-label" aria-hidden="true">Sortir</span></button>
  </div>
</header>
<section id="login-panel" class="card">
<h2>Inicia sessió</h2>
<p id="login-status" role="status">Carregant l’accés…</p>
<form id="login-form">
<div class="grid">
<label>Correu<input name="email" type="email" autocomplete="username" autocapitalize="none" required></label>
<label>Contrasenya<input name="password" type="password" autocomplete="current-password" required></label>
</div>
<div class="login-actions">
<button class="primary" value="login">Entra</button>
<button class="primary" value="register">Crea un compte</button>
</div>
<a id="password-reset" href="#reset-panel">He oblidat la contrasenya</a></form>
<details id="reset-panel" class="item" hidden>
<summary>Restableix amb un enllaç del correu</summary>
<form id="reset-link-form">
<div class="grid">
<label>Enllaç del correu de restabliment<input name="link" type="url" autocomplete="off" autocapitalize="none" required></label>
<label>Contrasenya nova<input name="password" type="password" minlength="6" autocomplete="new-password" required></label>
</div>
<button class="primary">Desa la contrasenya nova</button>
</form></details>
<div class="actions" id="verify-actions" hidden>
<button id="retry-login">Comprova l’accés</button>
<button id="resend-verification">Torna a enviar el correu</button>
</div>
<form id="verify-link-form" class="item" hidden>
<label>L’enllaç del correu dona error? Enganxa’l aquí<input name="link" type="url" autocomplete="off" autocapitalize="none" required></label>
<button type="submit">Verifica el correu</button>
</form></section>
<div id="workspace" hidden>
<p id="status" role="status"></p>
<section id="content" aria-label="Contingut"></section>
</div>
</main>
<script type="module">
const pdfLibrary = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.5.207/legacy/build/';
const ocrLibrary = 'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.esm.min.js';
const pdfKey = value => String(value || '').normalize('NFD').replace(/\p{Diacritic}/gu,'')
  .toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const unitsInPdf = {
  caixa:'caixes', caixes:'caixes', caja:'caixes', cajas:'caixes', kg:'kg', kgs:'kg',
  unitat:'unitats', unitats:'unitats', ut:'unitats', uts:'unitats', ud:'unitats', uds:'unitats',
  pieza:'peces', peces:'peces', bossa:'bosses', bosses:'bosses', bolsa:'bosses', bolsas:'bosses',
  safata:'safates', safates:'safates', bandeja:'safates', pot:'pots', pots:'pots',
  ampolla:'ampolles', ampolles:'ampolles', botella:'ampolles', botellas:'ampolles',
  paquet:'paquets', paquets:'paquets', sac:'sacs', sacs:'sacs', llauna:'llaunes',
  llaunes:'llaunes', litre:'litres', litres:'litres', litro:'litres', litros:'litres',
  manat:'manats', manats:'manats', pack:'packs', packs:'packs'
};
const descriptionHeader = /^(?:(?:descripcio|descripcion|description)(?: del (?:article|producto)| producte)?|article|articulo|producte|producto|producto descripcion|denominacion|nom|nombre|concepto)$/;
const otherHeader = /^(?:codigo|codi|referencia|ref|sku|ean|precio|preu|pvp|importe|total|iva|cantidad|quantitat|unidad|unitat|uds|uts|formato|format|presentacion|envase)(?: .*)?$/;

function pdfTextRows(items) {
  const lines = [];
  const positioned = items.filter(item => item.str?.trim() && item.transform).map(item => ({
    text:item.str.trim(), x:item.transform[4], y:item.transform[5], end:item.transform[4]+item.width,
    size:Math.hypot(item.transform[2],item.transform[3])
  })).sort((a,b) => b.y-a.y || a.x-b.x);
  for (const item of positioned) {
    const line = lines.at(-1);
    if (line && Math.abs(line[0].y-item.y) <= 2.5) line.push(item);
    else lines.push([item]);
  }
  return lines.map(line => {
    const columns = [];
    for (const item of line.sort((a,b) => a.x-b.x)) {
      const last = columns.at(-1);
      if (last && item.x-last.end <= 12) {
        last.text += ' '+item.text;
        last.end = Math.max(last.end,item.end);
      } else columns.push({...item});
    }
    return columns;
  });
}

function pdfSupplier(filename, head, suppliers) {
  const basename = pdfKey(filename.replace(/\.pdf$/i,''));
  const exact = suppliers.find(supplier => pdfKey(supplier.name) === basename);
  if (exact) return exact.id;
  const found = suppliers.filter(supplier => {
    const name = pdfKey(supplier.name);
    return name.length >= 4 && ((' '+basename+' ').includes(' '+name+' ') ||
      head.some(line => (' '+pdfKey(line)+' ').includes(' '+name+' ')));
  });
  return found.length === 1 ? found[0].id : '';
}

function catalogFromPdf(pages, filename, state) {
  const top = pages[0]?.slice(0,8).map(row => row.map(cell => cell.text).join(' ')) || [];
  const supplier = pdfSupplier(filename,top,state.suppliers);
  const anyList = pdfKey(top[0]) === 'falta';
  const bodySize = (pages[0]?.[0]?.[0]?.size || 0)*0.75;
  const supplierNames = new Set(state.suppliers.map(item => pdfKey(item.name)));
  const categories = new Map(state.categories.map(item => [pdfKey(item.name),item.name]));
  const articleNames = new Map();
  for (const item of state.articles) {
    const key = pdfKey(item.name);
    articleNames.set(key,articleNames.has(key) ? null : item);
  }
  const unique = new Map();
  let category = '';
  for (const [pageIndex,rows] of pages.entries()) {
    let header;
    for (const [index,row] of rows.entries()) {
      if (!row.length) continue;
      const joined = row.map(cell => cell.text).join(' ');
      const key = pdfKey(joined);
      const heading = categories.get(key);
      if (row.length === 1 && heading) { category = heading; continue; }
      if (key === 'uncategorized items') { category = ''; continue; }
      if (anyList && row[0].size && bodySize) {
        if (row[0].size < bodySize*0.92) continue;
        if (row.length === 1 && row[0].size > bodySize*1.08 && row[0].size < bodySize*1.25) {
          category = joined;
          continue;
        }
      }
      const description = row.findIndex(cell => descriptionHeader.test(pdfKey(cell.text)));
      if (description >= 0) {
        header = {start:row[description].x,end:row[description+1]?.x ?? Infinity};
        continue;
      }
      if (supplierNames.has(key) || /^(?:falta|catalogo|cataleg|tarifa|lista de precios|listado de articulos|llistat d articles|precios|pagina|page|pag |fecha|data |telefons? |telefonos? |fax |correo |email |www |https? |cif |nif |subtotal|total|iva |ref |notas? |observaciones|condiciones)(?:\b|$)/.test(key)) continue;
      const fields = header ? row.filter(cell => cell.x >= header.start-12 && cell.x < header.end-6) : row;
      let name = (header ? fields.map(cell => cell.text).join(' ') :
        fields.find(cell => /\p{L}{3}/u.test(cell.text) && !otherHeader.test(pdfKey(cell.text)))?.text || '').trim();
      if (!name || !/\p{L}{2}/u.test(name) || name.includes('@') || /^(?:€|EUR\b)/i.test(name)) continue;
      let unit = '';
      const parenthesis = name.match(/\s*\((?:\d+(?:[.,]\d+)?\s*[×x]\s*)?([\p{L}]+)\s*\)\s*$/u);
      if (parenthesis && unitsInPdf[pdfKey(parenthesis[1])]) {
        unit = unitsInPdf[pdfKey(parenthesis[1])];
        name = name.slice(0,parenthesis.index).trim();
      }
      if (!unit) {
        const unitField = row.find(cell => unitsInPdf[pdfKey(cell.text)]);
        if (unitField) unit = unitsInPdf[pdfKey(unitField.text)];
      }
      const existing = articleNames.get(pdfKey(name));
      const existingCategory = state.categories.find(item => item.id === existing?.category_id)?.name || '';
      if (existing && (!category || category === existingCategory)) name = existing.name;
      if (!name || name.length > 120) continue;
      const candidateCategory = category || existingCategory;
      const id = pdfKey(name)+'|'+pdfKey(candidateCategory);
      const previous = unique.get(id);
      const candidate = {name,category:candidateCategory,unit,page:pageIndex+1,include:Boolean(anyList || header || unit || existing || category || index >= 3)};
      if (!previous || (!previous.unit && unit)) unique.set(id,candidate);
    }
  }
  return {supplier, rows:[...unique.values()]};
}

async function readCatalogPdf(file, state, progress) {
  if (file.size > 20*1024*1024) throw new Error('El PDF supera els 20 MB. Divideix-lo en fitxers més petits.');
  const pdfjs = await import(pdfLibrary+'pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc = pdfLibrary+'pdf.worker.min.mjs';
  const task = pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false});
  let ocr;
  let scanned = false;
  try {
    const doc = await task.promise;
    if (doc.numPages > 50) throw new Error('El PDF té més de 50 pàgines. Divideix-lo en fitxers més petits.');
    const pages = [];
    for (let number=1;number<=doc.numPages;number++) {
      progress('Llegint la pàgina '+number+' de '+doc.numPages+'…');
      const page = await doc.getPage(number);
      const {items} = await page.getTextContent();
      let rows = pdfTextRows(items);
      if (items.map(item => item.str || '').join('').trim().length < 12) {
        scanned = true;
        progress('Reconeixent el text de la pàgina '+number+' de '+doc.numPages+'…');
        if (!ocr) {
          const library = await import(ocrLibrary);
          ocr = await (library.createWorker || library.default.createWorker)(['cat','spa','eng']);
        }
        const canvas = document.createElement('canvas');
        const natural = page.getViewport({scale:1});
        const viewport = page.getViewport({scale:Math.min(2,Math.sqrt(3_000_000/(natural.width*natural.height)))});
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        try {
          await page.render({canvas,canvasContext:canvas.getContext('2d'),viewport}).promise;
          const {data} = await ocr.recognize(canvas);
          rows = data.text.split('\n').filter(line => line.trim()).map(line =>
            line.trim().split(/\s{2,}/).map((text,x) => ({text,x:x*100})));
        } finally {
          canvas.width = canvas.height = 0;
        }
      }
      pages.push(rows);
      page.cleanup();
    }
    return {...catalogFromPdf(pages,file.name,state),scanned};
  } finally {
    await Promise.allSettled([task.destroy(),ocr?.terminate()]);
  }
}

function whatsappPhone(value) {
  const text = String(value || '').trim();
  if (!/^\+?[\d\s().-]+$/.test(text)) return '';
  const digits = text.replace(/\D/g,'');
  if (digits.startsWith('00')) return whatsappPhone('+'+digits.slice(2));
  if (!text.startsWith('+') && /^[6789]\d{8}$/.test(digits)) return '34'+digits;
  return /^[1-9]\d{7,14}$/.test(digits) ? digits : '';
}

function vCardContact(text) {
  const entries = text.replace(/\r?\n[ \t]/g,'').split(/\r?\n/);
  if (entries.filter(line => /^BEGIN:VCARD$/i.test(line.trim())).length !== 1) return null;
  const values = field => entries.filter(line =>
    new RegExp('^(?:[\\w-]+\\.)?'+field+'(?:;[^:]*)?:','i').test(line)
  ).map(line => line.slice(line.indexOf(':')+1)
    .replace(/\\[nN]/g,' ').replace(/\\([,;\\])/g,'$1').trim()).filter(Boolean);
  return {
    name:values('FN')[0] ?? '',
    tel:values('TEL').map(value => value.replace(/^tel:/i,'')),
    email:values('EMAIL').map(value => value.replace(/^mailto:/i,'')),
    uid:values('UID')[0] ?? ''
  };
}

function isMobileContactDevice() {

function combineDraftLines(lines) {
  const combined = new Map();
  for (const line of lines) {
    const key = JSON.stringify([line.article,line.supplier,line.unit]);
    const previous = combined.get(key);
    if (previous) {
      previous.quantity = Number((previous.quantity + line.quantity).toPrecision(15));
    } else {
      combined.set(key,{...line});
    }
  }
  return [...combined.values()];
}

function workerContactFromShortcut(text) {
  const [header,...lines] = text.trim().split(/\r?\n/);
  if (header !== 'NEXA-CONTACTE') return null;
  const values = new Map();
  let field;
  for (const line of lines) {
    const match = /^(nom|correu|telèfon)\s*:\s*(.*)$/iu.exec(line);
    if (match) {
      field = match[1].toLocaleLowerCase('ca');
      values.set(field,[match[2]]);
    } else if (field && line.trim()) {
      values.get(field).push(line.trim());
    }
  }
  const name = (values.get('nom') ?? []).filter(Boolean).join(' ').trim();
  const email = (values.get('correu') ?? []).map(value => value.trim()).filter(Boolean);
  const tel = (values.get('telèfon') ?? []).map(value => value.trim()).filter(Boolean);
  return name || email.length || tel.length ? {name, email, tel} : null;
}

function bindWorkerContacts(container) {
  const contactsByForm = new WeakMap();

  function updateContactStatus(form, text) {
    const status = form.querySelector('[data-worker-contact-status]');
    status.textContent = text;
    status.hidden = !text;
  }

  function setWorkerContactField(form, field, value) {
    const fields = form.elements;
    if (field === 'email' && value.toLowerCase() !== fields.email.value.trim().toLowerCase() && fields.tipsView.checked) {
      fields.tipsView.checked = false;
      return true;
    }
    return false;
  }

  function fillWorkerContact(form, contact) {
    const fields = form.elements;
    if (contact.name && !form.dataset.workerProfile) fields.name.value = contact.name.trim().slice(0,80);
    const groups = [
      ['email','Correu',contact.email || [],254],
      ['phone','Telèfon',contact.tel || [],48]
    ];
    const choices = document.createDocumentFragment();
    let reviewAccess = false;
    for (const [field,label,values,limit] of groups) {
      const options = [...new Set(values.map(value => value.trim().slice(0,limit)).filter(Boolean))];
      if (options.length === 1) {
        if (setWorkerContactField(form,field,options[0])) reviewAccess = true;
        fields[field].value = options[0];
      }
      if (options.length < 2) continue;
      const select = document.createElement('select');
      select.dataset.workerContactField = field;
      select.add(new Option('Tria '+label.toLowerCase(),''));
      for (const value of options) select.add(new Option(value,value));
      const wrapper = document.createElement('label');
      wrapper.append(label+' del contacte',select);
      choices.append(wrapper);
    }
    const panel = form.querySelector('[data-worker-contact-options]');
    panel.querySelectorAll('label:has([data-worker-contact-field])').forEach(label => label.remove());
    panel.append(choices);
    fields.contactName.value = (contact.name || contact.email?.[0] || contact.tel?.[0] || '').slice(0,160);
    fields.contactUid.value = contact.uid ?? '';
    updateContactStatus(form,'Revisa les dades del contacte i desa la fitxa.'+
      (reviewAccess ? ' Revisa si vols autoritzar el correu nou a GestoTips.' : ''));
  }

  container.addEventListener('click',async event => {
    const applyPaste = event.target.closest('[data-worker-apply-paste]');
    if (applyPaste) {
      const form = applyPaste.form;
      const input = form.querySelector('[data-worker-contact-paste]');
      const contact = workerContactFromShortcut(input.value) ?? vCardContact(input.value.trim());
      if (!contact || !(contact.name || contact.email.length || contact.tel.length)) {
        updateContactStatus(form,'Enganxa el contacte copiat per la drecera Nexa Contacte 2.');
        return;
      }
      fillWorkerContact(form,contact);
      input.value = '';
      form.querySelector('[data-worker-ios-panel]').open = false;
      return;
    }
    const picker = event.target.closest('[data-worker-contact]');
    if (!picker) return;
    const {form} = picker;
    try {
      const [contact] = await navigator.contacts.select(['name','email','tel'],{multiple:false});
      if (!contact || !form.isConnected) return;
      form.querySelector('[data-worker-contact-options]').replaceChildren();
      fillWorkerContact(form,{...contact,name:contact.name?.[0]});
    } catch (error) {
      if (form.isConnected && error.name !== 'AbortError') updateContactStatus(form,'No s’ha pogut obrir l’agenda. Pots escriure les dades al formulari.');
    }
  });

  container.addEventListener('change',async event => {
    const input = event.target;
    if (input.matches('[data-worker-contact-field]') && input.value) {
      const field = input.dataset.workerContactField;
      if (setWorkerContactField(input.form,field,input.value))
        updateContactStatus(input.form,'Revisa si vols autoritzar el correu nou a GestoTips abans de desar.');
      input.form.elements[field].value = input.value;
    } else if (input.matches('[data-worker-contact-choice]') && input.value) {
      const contact = contactsByForm.get(input.form)?.[Number(input.value)];
      if (contact) fillWorkerContact(input.form,contact);
    } else if (input.matches('[data-worker-vcard]') && input.files[0]) {
      const {form} = input;
      try {
        const file = input.files[0];
        if (file.size > 8*1024*1024) throw new Error();
        const text = await file.text();
        if (!form.isConnected) return;
        const contacts = (text.match(/^[ \t]*BEGIN:VCARD[ \t]*\r?$[\s\S]*?^[ \t]*END:VCARD[ \t]*\r?$/gim) || [])
          .map(vCardContact).filter(contact => contact && (contact.name || contact.email.length || contact.tel.length));
        if (!contacts.length) throw new Error();
        const panel = form.querySelector('[data-worker-contact-options]');
        panel.replaceChildren();
        if (contacts.length === 1) {
          fillWorkerContact(form,contacts[0]);
          return;
        }
        contactsByForm.set(form,contacts);
        const select = document.createElement('select');
        select.dataset.workerContactChoice = '';
        select.add(new Option('Tria una persona',''));
        contacts.forEach((contact,index) => select.add(new Option(
          [contact.name,contact.email[0]].filter(Boolean).join(' · ') || contact.tel[0],String(index))));
        const label = document.createElement('label');
        label.append('Contacte de l’agenda',select);
        panel.append(label);
        select.focus();
        updateContactStatus(form,'Tria la persona que vols associar.');
      } catch {
        if (form.isConnected) updateContactStatus(form,'Tria un fitxer .vcf vàlid de fins a 8 MB.');
      } finally {
        input.value = '';
      }
    }
  });
}

async function nexaMarInvoiceHeader(file) {
  const url = URL.createObjectURL(file);
  try {
    const photo = new Image();
    photo.src = url;
    await photo.decode();
    const headerHeight = Math.ceil(photo.naturalHeight * 0.56);
    const canvas = document.createElement('canvas');
    canvas.width = Math.min(photo.naturalWidth,1800);
    canvas.height = Math.ceil(headerHeight * canvas.width / photo.naturalWidth);
    canvas.getContext('2d').drawImage(photo,0,0,photo.naturalWidth,headerHeight,0,0,canvas.width,canvas.height);
    const jpeg = canvas.toDataURL('image/jpeg',0.85).split(',')[1];
    return jpeg?.length <= 500000 ? jpeg : undefined;
  } catch {
    return undefined;
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function connectNexaMar(email, password, apiKey) {
  const [appSdk, authSdk] = await Promise.all([
    import('https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js')
  ]);
  const config = {
    apiKey,
    authDomain:'control-de-peixos.firebaseapp.com',
    projectId:'control-de-peixos',
    appId:'1:194527539713:web:445d5d2405449af4bac600'
  };
  const app = appSdk.getApps().find(app => app.name === 'nexamar-catalog') ||
    appSdk.initializeApp(config,'nexamar-catalog');
  const auth = authSdk.initializeAuth(app,{persistence:authSdk.inMemoryPersistence});
  const {user} = await authSdk.signInWithEmailAndPassword(auth,email,password);
  return {
    async names() {
      const response = await fetch('https://firestore.googleapis.com/v1/projects/control-de-peixos/databases/(default)/documents/inventari/dades?mask.fieldPaths=noms',{
        headers:{Authorization:'Bearer '+await user.getIdToken()},cache:'no-store'
      });
      if (!response.ok) throw new Error('No s’ha pogut consultar el catàleg de GestoStock. Revisa els permisos del compte.');
      const document = await response.json();
      return (document.fields?.noms?.arrayValue?.values ?? [])
        .map(value => value.stringValue?.trim()).filter(Boolean);
    },
    async readInvoice(file) {
      const mimeType = (!file.type || file.type === 'application/octet-stream') && /\.pdf$/i.test(file.name)
        ? 'application/pdf' : file.type;
      if (!['application/pdf','image/jpeg','image/png','image/webp'].includes(mimeType)) {
        throw new Error('Format no admès. Utilitza JPG, PNG, WebP o PDF.');
      }
      if (file.size > 8*1024*1024) throw new Error('El fitxer supera els 8 MB.');
      const image = await new Promise((resolve,reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1]);
        reader.onerror = () => reject(new Error('No s’ha pogut obrir el fitxer.'));
        reader.readAsDataURL(file);
      });
      const headerImage = mimeType === 'application/pdf' ? undefined : await nexaMarInvoiceHeader(file);
      const response = await fetch('https://nexamar-ia.jninforner.workers.dev',{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+await user.getIdToken()},
        body:JSON.stringify({image,mimeType,headerImage})
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'El lector d’albarans no està disponible.');
      return {
        supplier:typeof result.supplier === 'string' ? result.supplier : '',
        names:(result.rows ?? []).filter(row => row.category !== 'service' && typeof row.name === 'string')
          .map(row => row.name.trim()).filter(Boolean)
      };
    }
  };
}

async function api(body) {
  if (request) return request(body);
  const response = await fetch('/api', body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {});
  const result = await response.json();
  if (!response.ok) throw Object.assign(new Error(result.error),{status:response.status});
  return result;
}

function notify(message, error = false) {
  status.textContent = message;
  status.classList.toggle('error',error);
}

async function save(payload, done, button, success = () => 'Canvis desats.', afterRender) {
  if (busy) return;
  busy = true;
  setSync('Desant…');
  if (button) button.disabled = true;
  let saved = false;
  try {
    const result = await api(payload);
    saved = true;
    done?.(result);
    data = await api();
    setSync(readyStatus);
    notify(success(result));
    render();
    afterRender?.();
  } catch (error) {
    setSync('Revisa l’últim canvi');
    if (error.status === 409 && ['draft','order'].includes(payload.action)) {
      try {
        data = await api();
        render();
      } catch {
        // Keep the previous view available if the refresh fails.
      }
    }
    const feedback = saved ? 'El canvi s’ha desat. Recarrega la pàgina per veure’l.' : error.message;
    const editorError = button?.form?.querySelector('[data-editor-error]');
    if (editorError?.isConnected) {
      editorError.textContent = feedback;
      editorError.hidden = false;
    }
    notify(feedback,true);
  } finally {
    busy = false;
    if (button) button.disabled = false;
  }
}

async function importReviewedCatalog(form, button) {
  if (busy) return;
  const supplier = form.elements.supplier.value === 'new' ? form.elements.newSupplier.value.trim() :
    byId('suppliers',form.elements.supplier.value)?.name;
  const articles = [...form.querySelectorAll('.pdf-row')].filter(row => row.querySelector('[name=include]').checked).map(row => ({
    name:row.querySelector('[name=name]').value.trim(),
    category:row.querySelector('[name=category]').value.trim(),
    unit:row.querySelector('[name=unit]').value.trim(),
    supplier
  }));
  if (!supplier || !articles.length || articles.some(article => !article.name)) {
    notify('Indica el proveïdor i marca les files que vols importar. Cada article ha de tenir nom.',true);
    return;
  }
  const batches = [];
  for (let index=0;index<articles.length;index+=150) batches.push(articles.slice(index,index+150));
  const totals = {imported:0,suppliers:0,links:0};
  busy = true;
  button.disabled = true;
  setSync('Desant…');
  try {
    for (const [index,batch] of batches.entries()) {
      notify('Important articles · '+(index+1)+' de '+batches.length+'…');
      const result = await api({action:'importCatalog',articles:batch});
      for (const key of Object.keys(totals)) totals[key] += result[key];
    }
    data = await api();
    pdfReview = null;
    setSync(readyStatus);
    notify(totals.imported+' articles nous i '+totals.links+' opcions de compra desades per a '+supplier+'.');
    render();
  } catch (error) {
    setSync('Revisa la importació');
    notify(error.message+' Pots tornar a prémer Importa per completar les files pendents.',true);
  } finally {
    busy = false;
    button.disabled = false;
  }
}

async function runBulk(payloads, button, describe) {
  if (busy) return;
  busy = true;
  button.disabled = true;
  setSync('Desant…');
  let done = 0;
  const failed = [];
  for (const [name,payload] of payloads) {
    try { await api(payload); done += 1; } catch { failed.push(name); }
  }
  try { data = await api(); } catch { /* es manté la vista anterior */ }
  busy = false;
  setSync(readyStatus);
  render();
  notify(describe(done)+(failed.length ? ' No s’ha pogut fer amb: '+failed.join(', ')+'.' : ''),failed.length > 0);
}

}

// L'esborrany canvia a la pantalla de seguida i es desa al servidor en segon pla (sense tornar a carregar totes les dades).
let draftPending = null;
let draftSending = null;
function saveDraft(lines, button, message = '') {
  data.draft.lines = combineDraftLines(lines);
  render();
  if (message) notify(message);
  draftPending = data.draft.lines;
  if (!draftSending) draftSending = sendDraft().finally(() => { draftSending = null; });
  return Promise.resolve();
}

async function sendDraft() {
  let failures = 0;
  while (draftPending) {
    const lines = draftPending;
    draftPending = null;
    setSync('Desant…');
    try {
      await api({action:'draft',lines,revision:data.draft.revision});
      data.draft.revision += 1;
      failures = 0;
    } catch (error) {
      if (error.status === 409) {
        // Un altre dispositiu ha canviat l'esborrany: es mostra el del servidor.
        data = await api().catch(() => data);
        render();
        notify('L’esborrany ha canviat en un altre dispositiu. Revisa les línies i repeteix el canvi.',true);
        draftPending = null;
        break;
      }
      if (error.status >= 400 && error.status < 500) {
        data = await api().catch(() => data);
        render();
        notify('No s’ha pogut desar l’últim canvi: '+error.message,true);
        draftPending = null;
        break;
      }
      // Sense connexió: es manté el canvi i es torna a provar.
      draftPending = draftPending || lines;
      failures += 1;
      setSync('Sense connexió · es tornarà a provar');
      await new Promise(resolve => setTimeout(resolve,Math.min(30000,3000*failures)));
    }
  }
  setSync(readyStatus);
}

  while (draftSending) await draftSending;

// Singular d'una unitat en català a partir del nom en plural (caixes → caixa, unitats → unitat).
// Només és una suggerència: a la fitxa de la unitat es pot escriure el singular correcte.
function guessSingular(name) {
  const [word, ...rest] = String(name ?? '').split(' ');
  const lower = word.toLocaleLowerCase('ca');
  let singular = word;
  if (word.length > 3 && lower.endsWith('s')) {
    if (/[tbd]res$/.test(lower)) singular = word.slice(0,-1);
    else if (lower.endsWith('ques')) singular = word.slice(0,-4)+'ca';
    else if (lower.endsWith('gues')) singular = word.slice(0,-4)+'ga';
    else if (lower.endsWith('ces')) singular = word.slice(0,-3)+'ça';
    else if (lower.endsWith('ges')) singular = word.slice(0,-3)+'ja';
    else if (lower.endsWith('ions')) singular = word.slice(0,-4)+'ió';
    else if (lower.endsWith('es')) singular = word.slice(0,-2)+'a';
    else singular = word.slice(0,-1);
  }
  return [singular,...rest].join(' ');
}

function unitLabel(unitName, quantity) {
  if (quantity !== 1) return unitName;
  const unit = data.units.find(item => item.name === unitName);
  return unit?.singular || guessSingular(unitName);
}

function supplierMessage(lines, current, recipient) {
  const supplier = lines[0];
  const articles = lines.map(line => '• '+quantityFormat.format(line.quantity)+' '+unitLabel(line.unit,Number(line.quantity))+' de '+line.article).join('\n');
  const contact = recipient || current?.contact || supplier.contact;
  const template = supplier.message_template ?? current?.message_template;
  const hello = contact ? 'Bon dia, '+contact+'!' : 'Bon dia!';
  if (!template) return hello+' Us voldríem fer aquesta comanda:\n\n'+articles+'\n\nGràcies!';
  const values = {comercial:contact || supplier.supplier,proveidor:supplier.supplier,articles};
  const text = template.replace(/\{(comercial|proveidor|articles)\}/g,(_, key) => values[key]);
  return template.includes('{articles}') ? text : text+'\n\n'+articles;
}

  return '<section class="item"><h3>'+escape(supplier.supplier)+'</h3><label>Missatge<textarea readonly rows="'+Math.min(13,lines.length+4)+'">'+escape(message)+'</textarea></label>'+
    '<div class="actions"><button data-copy>Copia el missatge</button>'+
    (!phone && current ? '<a href="'+escape(whatsappLink('',message))+'">Tria dins de WhatsApp</a>' : '')+'</div>'+chooser+'</section>';
}

async function openOrderRecipient(form, button) {
  if (busy) return;
  const phone = whatsappPhone(form.elements.phone.value);
  if (!phone) {
    notify('Indica un número de WhatsApp amb el prefix internacional.',true);
    form.elements.phone.focus();
    return;
  }
  const supplier = byId('suppliers',form.dataset.supplierId);
  const lines = data.lines.filter(line => line.order_id === form.dataset.orderId && line.supplier_id === supplier?.id);
  if (!lines.length) return;

const moneyFormat = new Intl.NumberFormat('ca-ES',{style:'currency',currency:'EUR'});
const dayFormat = new Intl.DateTimeFormat('ca-ES',{dateStyle:'medium',timeZone:'UTC'});

// Article que més s'assembla al text de l'albarà (si n'hi ha un de clar).
function guessArticle(name) {
  const words = searchKey(name).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(word => word.length >= 3);
  if (!words.length) return '';
  let best = null, bestScore = 0;
  for (const article of data.articles.filter(item => !item.archived)) {
    const key = searchKey(article.name);
    const own = key.replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(word => word.length >= 3);
    if (!own.length) continue;
    const hits = own.filter(word => words.some(other => other.startsWith(word) || word.startsWith(other))).length;
    const score = hits / own.length;
    if (score > bestScore) { best = article; bestScore = score; }
  }
  return bestScore >= .99 ? best.id : '';
}

async function fileToBase64(file) {
  // Les fotos grans es redueixen (màx. 2200 px) perquè la lectura sigui ràpida.
  if (file.type.startsWith('image/') && file.size > 1_500_000) {
    try {
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.src = url;
      await image.decode();
      const scale = Math.min(1,2200/Math.max(image.naturalWidth,image.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(image.naturalWidth*scale);
      canvas.height = Math.round(image.naturalHeight*scale);
      canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
      URL.revokeObjectURL(url);
      return {image:canvas.toDataURL('image/jpeg',.85).split(',')[1], mimeType:'image/jpeg'};
    } catch {
      // Si no es pot reduir, s'envia tal com és.
    }
  }
  const bytes = new Uint8Array(await file.arrayBuffer());
  let binary = '';
  for (let i = 0; i < bytes.length; i += 32768) binary += String.fromCharCode(...bytes.subarray(i,i+32768));
  return {image:btoa(binary), mimeType:file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf') ? 'application/pdf' : file.type};
}

async function readPurchase(form, button) {
  const file = form.elements.file.files[0];
  if (!file || busy) return;
  if (file.size > 8*1024*1024 && !file.type.startsWith('image/')) { notify('El fitxer fa més de 8 MB.',true); return; }
  busy = true;
  readingInvoice = true;
  render();
  notify('Llegint l’albarà amb IA… pot trigar uns segons.');
  try {
    const result = await api({action:'readInvoice',...await fileToBase64(file)});
    invoiceReview = {...result, rows:result.rows.map(row => {
      const articleId = row.articleId && byId('articles',row.articleId) ? row.articleId : guessArticle(row.name);
      return {...row, articleId, newName:'', toStock:row.fish, discard:false};
    })};
    duplicateAllowed = false;
    notify(result.rows.length ? 'Revisa les línies i desa la compra.' : 'No s’ha trobat cap línia a l’albarà.',!result.rows.length);
  } catch (error) {
    notify('No s’ha pogut llegir l’albarà: '+error.message,true);
  } finally {
    busy = false;
    readingInvoice = false;
    render();
  }
}

async function savePurchaseReview(form, button) {
  syncInvoiceReview(form);

  const missing = kept.findIndex(row => !row.articleId && !row.newName);
  if (missing >= 0) { notify('A la línia «'+kept[missing].name+'» li falta l’article.',true); form.elements['article-'+review.rows.indexOf(kept[missing])]?.focus(); return; }
  const payload = {action:'savePurchase', supplierId:review.supplierId, supplierName:review.supplierId ? '' : review.supplierName,
    date:review.date, invoiceNumber:review.invoiceNumber.trim(), force:duplicateAllowed,
    lines:kept.map(row => ({articleId:row.articleId, newArticle:row.newName, name:row.name, quantity:row.quantity, unit:row.unit,
      unitPrice:row.unitPrice, total:row.total, kg:row.kg, units:row.units, toStock:row.toStock}))};
  try {
    await api(payload);
  } catch (error) {
    if (error.status === 409 && /ja s’havia desat/.test(error.message)) duplicateAllowed = true;

}

    field.closest('label').hidden = event.target.value !== 'new';
    field.required = event.target.value === 'new';
    if (field.required) field.focus();
  }
  if (event.target.id === 'category-filter' || event.target.id === 'supplier-filter') {
    if (event.target.id === 'category-filter') categoryFilter = event.target.value;
    else supplierFilter = event.target.value;
    addingArticle = '';
    refreshCatalogRows();
  }
  if (event.target.matches('#catalog-line select[name=supplier]')) {
    const form = event.target.form;
    const article = byId('articles',form.elements.article.value);
    const offer = data.offers.find(item => item.article_id === article.id && item.supplier_id === event.target.value);
    form.elements.unit.value = offerUnit(article,offer);
  }
  if (event.target.matches('#offer select[name=supplier]')) {
    const offer = data.offers.find(item => item.article_id === edit && item.supplier_id === event.target.value);
    document.querySelector('#offer select[name=unit]').value = offer && offer.unit_id !== pendingUnit ? offer.unit_id : byId('articles',edit)?.unit_id || '';
  }
});

function refreshCatalogRows() {
  document.querySelector('#catalog-rows').innerHTML = catalogRows();
}

document.addEventListener('input', event => {
  if (event.target.id === 'order-search') {
    orderSearch = event.target.value;
    showMatches = true;
    orderOptions();
  }
  if (event.target.id !== 'article-search') return;
  articleSearch = event.target.value;
  addingArticle = '';
  refreshCatalogRows();
});

document.addEventListener('keydown', event => {
  if (event.target.id !== 'order-search' || event.key !== 'ArrowDown') return;
  const first = document.querySelector('#order-matches button');
  if (!first) return;
  event.preventDefault();
  first.focus();
});

document.addEventListener('submit',async event => {
  const form = event.target;
  if (!form.closest('#workspace')) return;
  event.preventDefault();
  const values = Object.fromEntries(new FormData(form));
  if (form.id === 'connect-nexamar' || form.id === 'read-invoice') {
    await updateNexaMar(form,values,event.submitter);
  } else if (form.id === 'link-shared-article') {
    await save({...values,action:'linkSharedArticle'},() => {
      sharedArticleName = '';
      sharedArticleId = '';
    },event.submitter,()=>'Article desat al catàleg compartit.');
  } else if (form.id === 'merge-articles') {
    const target = byId('articles',values.target);
    const sources = [...mergeSelection].filter(id => id !== values.target);
    if (!target || !mergeSelection.has(target.id) || !sources.length) return;
    if (!window.confirm('Vols fusionar '+sources.length+' articles amb «'+target.name+'»? Es conservarà l’històric.')) return;
    await save({action:'mergeArticles',id:target.id,sources},() => {
      mergeSelection.clear();
      addingArticle = '';
      edit = target.id;
    },event.submitter,()=>'Articles fusionats.');
  } else if (form.id === 'order-add-search') {
    if (busy || !values.articleName.trim()) return;
    orderSearch = values.articleName.trim();
    const matches = orderMatches().filter(article => matchesArticleName(article,searchKey(orderSearch),true));
    if (matches.length === 1) {
      await pickOrderArticle(matches[0].id,event.submitter);
    } else if (matches.length > 1) {
      showMatches = true;
      orderOptions();
      document.querySelector('#order-matches button')?.focus();
    } else if (data.articles.some(article => article.archived && matchesArticleName(article,searchKey(orderSearch),true))) {
      notify('Aquest article està arxivat. Restaura’l des de Menú → Eines del catàleg → Mostra els arxivats.',true);
    } else {
      creatingArticle = true;
      showMatches = false;
      render();
      document.querySelector('#quick-article select[name=supplier]').focus();
    }
  } else if (Object.hasOwn(form.dataset,'orderRecipient')) {
    await openOrderRecipient(form,event.submitter);
  } else if (Object.hasOwn(form.dataset,'editQuantity')) {
    const index = form.dataset.editQuantity;
    const quantity = form.elements.quantity.valueAsNumber;
    if (!Number.isFinite(quantity) || quantity <= 0) {
      form.elements.quantity.focus();
      form.elements.quantity.setCustomValidity('La quantitat ha de ser un número més gran que zero.');
      form.elements.quantity.reportValidity();
      form.elements.quantity.setCustomValidity('');
      return;
    }
    if (index === '') {
      await addDraftLine({...values,article:form.dataset.article},event.submitter);
      return;
    }
    const lines = data.draft.lines.map((line,position) => position === Number(index) ? {...line,quantity,unit:values.unit,supplier:values.supplier} : line);
    await saveDraft(combineDraftLines(lines),event.submitter);
  } else if (form.id === 'read-catalog') {
    await analyzeCatalog(form,event.submitter);
  } else if (form.id === 'confirm-pdf') {
    await importReviewedCatalog(form,event.submitter);
  } else if (form.id === 'catalog') {
    if (section === 'suppliers' && values.phone.trim()) {
      values.phone = whatsappPhone(values.phone);
      if (!values.phone) {
        notify('Indica un número de WhatsApp vàlid.',true);
        form.elements.phone.focus();
        return;
      }
    }
    await save({...values,action:section,id:''},() => {
      edit = '';
    },event.submitter);
  } else if (form.id === 'read-purchase') {
    await readPurchase(form,event.submitter);
  } else if (form.id === 'purchase-review') {
    await savePurchaseReview(form,event.submitter);
  } else if (form.id === 'bulk-supplier') {
    const selected = data.articles.filter(article => mergeSelection.has(article.id));
    const supplier = byId('suppliers',values.supplier);
    if (!supplier || !selected.length) return;
    const missing = selected.filter(article => !values.unit && !article.unit_id);
    if (missing.length) { notify('Tria una unitat de compra: '+missing.map(article => article.name).join(', ')+' no en té.',true); return; }
    await runBulk(selected.map(article => [article.name,{action:'offer',article:article.id,supplier:supplier.id,unit:values.unit || article.unit_id}]),event.submitter,
      done => supplier.name+' assignat a '+done+(done === 1 ? ' article.' : ' articles.'));
  } else if (form.id === 'catalog-edit') {
    if (form.dataset.section === 'suppliers' && values.phone.trim()) {
      values.phone = whatsappPhone(values.phone);
      if (!values.phone) {
        notify('Indica un número de WhatsApp vàlid.',true);
        form.elements.phone.focus();
        return;
      }
    }
    await save({...values,action:form.dataset.section,id:form.dataset.id},() => {
      form.closest('dialog')?.close();
    },event.submitter);
  } else if (form.id === 'article-sheet') {
    await save({...values,action:'articles',id:sheetId},null,event.submitter,()=>'Fitxa desada.');
  } else if (form.id === 'offer') {
    await save({...values,action:'offer',article:edit},null,event.submitter);
  } else if (form.id === 'quick-article') {
    let createdId;
    await save({...values,action:'quickArticle'},result => {
      createdId = result.id;
      orderSearch = values.name.trim();
      showMatches = false;
      creatingArticle = false;
    },event.submitter,()=>'Article creat.');
    if (createdId && byId('articles',createdId)) await pickOrderArticle(createdId);
  } else if (form.id === 'catalog-line') {
    await addDraftLine(values,event.submitter,true);
  }
});

async function addDraftLine(values, button, fromCatalog = false) {
  const {article,supplier,unit} = values;
  const quantity = Number(values.quantity);
  const offer = data.offers.find(item => item.article_id === article && item.supplier_id === supplier);
  if (!offer || !unit || !Number.isFinite(quantity) || quantity <= 0) {
    notify('Tria un article, un proveïdor i una unitat, i indica una quantitat positiva.',true);
    return;
  }
  const lines = combineDraftLines([...data.draft.lines,{article,supplier,unit,quantity}]);
  if (lines.length > 100 || lines.some(line => !Number.isFinite(line.quantity))) {
    notify('Revisa el total de la quantitat. La comanda admet fins a 100 línies.',true);
    return;
  }
  {
    if (fromCatalog) {
      addingArticle = '';
    } else {
      if (showMatches && !matchesOrderCategory(byId('articles',article))) orderCategory = '';
      if (orderSupplier && orderSupplier !== supplier) orderSupplier = '';
      orderSearch = '';
      showMatches = false;
      creatingArticle = false;
    }
  }
  await saveDraft(lines,button,'Article afegit a la comanda.');
}

if (!initialData) setSync('Carregant…');
(initialData ? Promise.resolve(initialData) : api()).then(result => {
  data = result;
  setSync(readyStatus);
  notify('');
  render();
}).catch(error => {
  setSync('Sense connexió');
  notify('No s’han pogut carregar les dades. '+error.message,true);
});

}

import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js';
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendEmailVerification, sendPasswordResetEmail, signOut, reload, checkActionCode, applyActionCode, verifyPasswordResetCode, confirmPasswordReset
} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js';

async function startStaffApp(apiOrigin, mountApp, apiPath = '/api', firebaseAppName = 'tracacomandes', appLabel = 'GestoCatalog') {
  const panel = document.querySelector('#login-panel');
  const form = document.querySelector('#login-form');
  const message = document.querySelector('#login-status');
  const actions = document.querySelector('#verify-actions');
  const repair = document.querySelector('#verify-link-form');
  const resetPanel = document.querySelector('#reset-panel');
  const resetForm = document.querySelector('#reset-link-form');
  const logout = document.querySelector('#logout');
  const workspace = document.querySelector('#workspace');
  let auth;
  let mounted = false;
  let busy = false;
  const emailAction = new URL(location.href);
  const incomingMode = emailAction.searchParams.get('mode');
  let actionMode = ['verifyEmail','resetPassword'].includes(incomingMode) && emailAction.searchParams.get('oobCode') ? incomingMode : '';
  if (actionMode) history.replaceState(null,'',location.pathname);

  function show(text) {
    message.textContent = text;
  }

  function errorMessage(error) {
    switch (error.code) {
      case 'auth/invalid-credential': return 'El correu o la contrasenya no són correctes.';
      case 'auth/email-already-in-use': return 'Aquest correu ja té compte. Inicia sessió o restableix la contrasenya.';
      case 'auth/weak-password': return 'Tria una contrasenya d’almenys sis caràcters.';
      case 'auth/too-many-requests': return 'Massa intents. Torna-ho a provar més tard.';
      default: return error.status ? error.message : 'No hi ha connexió amb el servei d’accés. Torna-ho a provar.';
    }
  }

  async function request(body) {
    const token = await auth.currentUser?.getIdToken();
    if (!token) throw Object.assign(new Error('Torna a iniciar sessió.'),{status:401});
    const headers = {Authorization:'Bearer '+token};
    if (body) headers['Content-Type'] = 'application/json';
    const response = await fetch(apiOrigin+apiPath,{method:body ? 'POST' : 'GET',headers,
      body:body ? JSON.stringify(body) : undefined,cache:'no-store',credentials:'omit'});
    const result = await response.json();
    if (!response.ok) throw Object.assign(new Error(result.error),{status:response.status});
    return result;
  }

  async function enter(user) {
    form.hidden = Boolean(user);
    resetPanel.hidden = Boolean(user);
    actions.hidden = !user;
    repair.hidden = !user || user.emailVerified;
    logout.hidden = !user;
    if (!user) {
      show('');
      return;
    }
    show('Comprovant l’accés…');
    try {
      const data = await request();
      if (auth.currentUser?.uid !== user.uid || mounted) return;
      mounted = true;
      panel.hidden = true;
      workspace.hidden = false;
      mountApp(request,data);
    } catch (error) {
      document.querySelector('#resend-verification').hidden = user.emailVerified;
      show(errorMessage(error));
    }
  }

  async function withFeedback(operation) {
    if (busy) return;
    busy = true;
    try { await operation(); }
    catch (error) { show(errorMessage(error)); }
    finally { busy = false; }
  }

  try {
    const response = await fetch(apiOrigin+'/auth-config',{cache:'no-store',credentials:'omit'});
    if (!response.ok) throw new Error('Firebase configuration unavailable');
    // GestoCatalog manté el nom 'tracacomandes' perquè la sessió sobrevisqui al canvi de nom.
    auth = getAuth(initializeApp(await response.json(),firebaseAppName));
    auth.languageCode = 'ca';
  } catch {
    show('L’accés de l’equip no està disponible. Torna-ho a provar més tard.');
    form.hidden = true;
    resetPanel.hidden = true;
    return;
  }

  const emailField = form.elements.email;
  form.addEventListener('submit',event => {
    event.preventDefault();
    void withFeedback(async () => {
      const email = emailField.value.trim();
      const password = form.elements.password.value;
      if (event.submitter?.value === 'register') {
        const {user} = await createUserWithEmailAndPassword(auth,email,password);
        await sendEmailVerification(user);
        show('T’hem enviat un correu de verificació. Obre’l i torna aquí per continuar.');
      } else {
        await signInWithEmailAndPassword(auth,email,password);
      }
      form.reset();
    });
  });

  function emailActionCode(value, mode) {
    try {
      const link = new URL(value.trim());
      if (((link.origin === 'https://'+auth.app.options.authDomain && link.pathname === '/__/auth/action') ||
           (link.origin === 'https://jninforner.github.io' && ['/GestoComandes/','/NexaComandes/','/tracacomandes/'].includes(link.pathname))) && link.searchParams.get('mode') === mode) {
        return link.searchParams.get('oobCode');
      }
    } catch {
      return null;
    }
    return null;
  }

  resetForm.addEventListener('submit',event => {
    event.preventDefault();
    void withFeedback(async () => {
      const code = emailActionCode(resetForm.elements.link.value,'resetPassword');
      if (!code) {
        show('Enganxa l’enllaç complet del correu de restabliment de contrasenya de '+appLabel+'.');
        return;
      }
      try {
        const email = await verifyPasswordResetCode(auth,code);
        await confirmPasswordReset(auth,code,resetForm.elements.password.value);
        resetForm.reset();
        resetForm.elements.link.closest('label').hidden = false;
        resetPanel.open = false;
        if (actionMode) {
          actionMode = '';
          if (auth.currentUser) await signOut(auth);
          await enter(null);
        }
        emailField.value = email;
        form.elements.password.value = '';
        form.elements.password.focus();
        show('Contrasenya desada. Ja pots entrar amb la nova.');
      } catch (error) {
        resetForm.elements.password.value = '';
        if (['auth/invalid-action-code','auth/expired-action-code'].includes(error.code)) {
          show('Aquest enllaç ha caducat o ja s’ha utilitzat. Demana’n un de nou amb «He oblidat la contrasenya».');
        } else {
          throw error;
        }
      }
    });
  });

  document.querySelector('#password-reset').onclick = event => {
    event.preventDefault();
    void withFeedback(async () => {
      if (!emailField.reportValidity()) return;
      await sendPasswordResetEmail(auth,emailField.value.trim());
      show('Si existeix un compte amb aquest correu, rebràs un enllaç per restablir la contrasenya.');
    });
  };

  document.querySelector('#retry-login').onclick = () => withFeedback(async () => {
    if (!auth.currentUser) return;
    await reload(auth.currentUser);
    if (!auth.currentUser) return;
    await auth.currentUser.getIdToken(true);
    await enter(auth.currentUser);
  });

  document.querySelector('#resend-verification').onclick = () => withFeedback(async () => {
    if (!auth.currentUser) return;
    await sendEmailVerification(auth.currentUser);
    show('T’hem tornat a enviar el correu de verificació.');
  });

  repair.addEventListener('submit',event => {
    event.preventDefault();
    void withFeedback(async () => {
      const user = auth.currentUser;
      if (!user && actionMode !== 'verifyEmail') return;
      const code = emailActionCode(repair.elements.link.value,'verifyEmail');
      if (!code) {
        show('Enganxa l’enllaç complet del correu de verificació de '+appLabel+'.');
        return;
      }
      try {
        const info = await checkActionCode(auth,code);
        if (info.operation !== 'VERIFY_EMAIL' || (user && actionMode !== 'verifyEmail' && info.data.email?.toLowerCase() !== user.email?.toLowerCase())) {
          show('Aquest enllaç correspon a un altre compte.');
          return;
        }
        await applyActionCode(auth,code);
        repair.reset();
        actionMode = '';
        if (user && info.data.email?.toLowerCase() === user.email?.toLowerCase()) {
          await reload(user);
          await user.getIdToken(true);
          await enter(user);
        } else {
          if (user) await signOut(auth);
          await enter(null);
          emailField.value = info.data.email || '';
          show('Correu verificat. Ja pots iniciar sessió.');
        }
      } catch (error) {
        if (['auth/invalid-action-code','auth/expired-action-code'].includes(error.code)) {
          show('L’enllaç ha caducat o ja s’ha utilitzat. Prem «Comprova l’accés» o demana un correu nou.');
        } else {
          throw error;
        }
      }
    });
  });

  logout.onclick = () => withFeedback(async () => {
    await signOut(auth);
    location.reload();
  });

  if (actionMode) {
    form.hidden = true;
    resetPanel.hidden = actionMode !== 'resetPassword';
    resetPanel.open = !resetPanel.hidden;
    repair.hidden = actionMode !== 'verifyEmail';
    const current = resetPanel.hidden ? repair : resetForm;
    current.elements.link.value = emailAction.href;
    current.elements.link.closest('label').hidden = true;
    show(actionMode === 'resetPassword' ? 'Tria una contrasenya nova.' : 'Prem el botó per confirmar el correu.');
  }

  onAuthStateChanged(auth,user => {
    if (actionMode) return;
    if (mounted && !user) location.reload();
    else if (!mounted) void enter(user);
  });
}

startStaffApp(location.hostname === "jninforner.github.io" ? "https://gesto-apps.jninforner.workers.dev" : location.origin,mountApp);
</script>
